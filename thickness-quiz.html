<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zach Thick and Thin Quiz</title><style>body{font-family:Arial;background:#eaf5ff;color:#17365a;max-width:700px;margin:auto;padding:20px}main{background:white;padding:25px;border-radius:20px}h1{text-align:center}.books{display:flex;justify-content:space-around;align-items:end;height:190px}.book{height:125px;background:#80c5ed;border:2px solid #23618c;border-radius:6px;display:flex;align-items:center;justify-content:center;margin:auto}.item{text-align:center;flex:1}button{display:block;width:100%;padding:15px;margin:12px 0;border:2px solid #c9daed;border-radius:12px;background:#f5faff;font-size:17px;text-align:left}button:disabled{opacity:.8}.good{background:#d3f8dc}.bad{background:#ffd7d7}#next{background:#2475cf;color:white;text-align:center}#next:disabled{opacity:.4}</style><main><h1>📚 Zach's Thick & Thin Quiz</h1><p id="progress"></p><div class="books" id="books"></div><h2>Which of the following statements is correct?</h2><div id="answers"></div><p id="feedback"></p><button id="next" disabled>Next →</button></main><script>const qs=[[[2,5,1],[[0,1],[2,1],[1,0]],1],[[8,3,6],[[1,0],[2,1],[0,2]],0],[[4,7,2],[[1,0],[0,2],[2,1]],2],[[5,2,9],[[2,0],[1,2],[0,1]],1],[[3,1,6],[[2,1],[0,2],[1,2]],2]];let n=0,score=0;const el=id=>document.getElementById(id);function show(){let q=qs[n];el('progress').textContent='Question '+(n+1)+' / 5   ⭐ '+score;el('books').innerHTML=q[0].map((v,j)=>'<div class="item"><div class="book" style="width:'+(30+v*12)+'px">'+String.fromCharCode(65+j)+'</div><p>Book '+String.fromCharCode(65+j)+'</p></div>').join('');el('answers').innerHTML=q[1].map((pair,j)=>'<button onclick="pick('+j+')">'+String.fromCharCode(65+j)+'. Book '+String.fromCharCode(65+pair[0])+' is the thinnest and Book '+String.fromCharCode(65+pair[1])+' is the thickest.</button>').join('');el('feedback').textContent='';el('next').disabled=true}function pick(k){let q=qs[n];if(k===q[2])score++;Array.from(el('answers').children).forEach((b,j)=>{b.disabled=true;if(j===q[2])b.className='good';else if(j===k)b.className='bad'});el('feedback').textContent=k===q[2]?'🌟 Correct! Great job!':'💡 Good try! The green answer is correct.';el('next').disabled=false}el('next').onclick=()=>{n++;if(n<5)show();else document.querySelector('main').innerHTML='<h1>🏆 Well done, Zach!</h1><h2>Your score: '+score+' / 5</h2><button onclick="location.reload()">Try again</button>'};show();</script></html>
