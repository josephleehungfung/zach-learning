<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6657e8"><title>Zach's Book Explorer</title>
<style>
:root{--ink:#24315d;--violet:#6657e8;--pink:#ff75a4;--mint:#46c6a6;--gold:#ffc75b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,#ffe8b8 0,transparent 30%),radial-gradient(circle at 90% 20%,#c4f4e9 0,transparent 32%),linear-gradient(135deg,#eef0ff,#f9edff);padding:22px 15px 50px}.shell{max-width:820px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:14px;font-weight:900;letter-spacing:1.5px;color:#6257ae}.sound{border:2px solid #dcd9fb;background:white;border-radius:50px;padding:10px 15px;font-weight:800;color:#5b52a4;cursor:pointer}h1{font-size:clamp(29px,6vw,48px);line-height:1.1;text-align:center;margin:18px 0 8px}.subtitle{text-align:center;font-size:16px;color:#777da0;margin:0 0 20px}.panel{background:#fff;border:3px solid #fff;border-radius:30px;padding:clamp(18px,4vw,34px);box-shadow:0 18px 45px #6559a829}.row{display:flex;justify-content:space-between;font-weight:900;font-size:15px;gap:12px}.track{background:#ecebfa;height:13px;border-radius:30px;overflow:hidden;margin:13px 0 25px}.fill{height:100%;width:0;background:linear-gradient(90deg,#62d6ae,#6657e8);transition:width .35s}.stage{background:linear-gradient(160deg,#f5f2ff,#e9f9ff);border-radius:24px;padding:22px 12px 14px;border:2px dashed #d6d0ff}.books{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:210px}.item{flex:1;min-width:0;text-align:center}.book{height:147px;margin:auto;max-width:95%;display:flex;align-items:center;justify-content:center;border:3px solid #4c69a0;border-left:9px solid #4c69a0;border-radius:5px 13px 13px 5px;background:linear-gradient(130deg,#c0e9ff,#69b8ed);box-shadow:6px 7px 0 #a1b4cf55;position:relative;font-size:27px;font-weight:1000;color:#25477e;transition:width .35s}.book:after{content:"";position:absolute;right:5px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#ffffffa0}.item:nth-child(2) .book{background:linear-gradient(130deg,#ffe4a2,#ffb55d);border-color:#be7b48;color:#81502e}.item:nth-child(3) .book{background:linear-gradient(130deg,#c4f8ce,#70d7a0);border-color:#45967c;color:#276e5c}.label{font-size:13px;font-weight:900;margin:15px 0 0}.hint{text-align:center;color:#7a7b9e;font-size:12px;margin-top:13px}h2{font-size:clamp(18px,4vw,23px);margin:25px 0 17px}.answer{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid #e2e5f5;border-radius:17px;background:#fafbff;padding:14px;margin:11px 0;font-size:clamp(14px,2.5vw,17px);line-height:1.5;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s}.answer:not(:disabled):active{transform:scale(.985)}.badge{background:#ebe8ff;border-radius:12px;min-width:40px;height:40px;display:grid;place-items:center;font-weight:1000;color:#6657e8}.answer.correct{border-color:#39bf91;background:#e5fff2}.answer.wrong{border-color:#ff8b98;background:#fff0f1}.answer:disabled{cursor:default}.feedback{font-weight:900;min-height:30px;margin:16px 0;color:#298c6b}.next{display:block;width:100%;border:0;border-radius:17px;padding:17px;background:linear-gradient(100deg,#6657e8,#a06ce8);box-shadow:0 7px 0 #5142bb;color:white;font-weight:1000;font-size:19px;cursor:pointer}.next:disabled{opacity:.45;box-shadow:none;cursor:default}.result{text-align:center;padding:45px 15px}.score{font-size:54px;font-weight:1000;color:#6657e8;margin:15px 0}.confetti{font-size:48px}footer{text-align:center;color:#9293b2;font-size:12px;padding:22px}@media(max-width:480px){.books{height:170px}.book{height:113px;font-size:23px}.stage{padding:15px 5px 12px}.label{font-size:12px}.badge{min-width:34px;height:34px}}
.battle{text-align:center;background:linear-gradient(130deg,#fff0d8,#ffe2f0);border-radius:22px;padding:16px;margin-bottom:22px}.monster{font-size:72px;display:inline-block;transition:transform .5s,opacity .5s}.monster.hit{animation:shake .5s}.monster.down{transform:rotate(85deg) scale(.65);opacity:.5}.hp{height:18px;background:#f3c5d0;border-radius:30px;overflow:hidden;margin:10px auto;max-width:450px}.hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ffbf50,#f05f82);transition:width .6s}.battle-label{font-weight:900;color:#a34b73}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-15px) rotate(-12deg)}60%{transform:translateX(13px) rotate(12deg)}}.fighters{display:flex;align-items:center;justify-content:space-evenly;max-width:390px;margin:8px auto 2px}.hero{font-size:65px;display:inline-block;transform-origin:70% 85%}.hero.slash{animation:slash .65s ease-in-out}.versus{font-size:27px;font-weight:1000;color:#a05a86}.strike{position:absolute;font-size:48px;left:50%;top:20%;pointer-events:none;animation:strike .7s forwards}.enemy-wrap{position:relative}@keyframes slash{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(38px) rotate(-28deg)}65%{transform:translateX(62px) rotate(24deg)}}@keyframes strike{0%{opacity:0;transform:scale(.3) rotate(-40deg)}35%{opacity:1;transform:scale(1.3) rotate(0)}100%{opacity:0;transform:scale(1.7) rotate(30deg)}}@media(prefers-reduced-motion:reduce){.hero.slash,.strike{animation:none}}.sprite{display:block;width:110px;height:130px;overflow:visible;filter:drop-shadow(0 5px 2px #4e51832b)}.monster-sprite{width:120px}.fighters{background:linear-gradient(180deg,#cdeaff 0%,#e7f9ff 65%,#c8eac7 65%,#a9dbad 100%);border-radius:20px;min-height:165px;padding:12px 4px;overflow:hidden}.hero,.monster{font-size:initial}.hero.slash{animation:knightStrike .65s ease-in-out}.hero .sword{transform-origin:90px 80px}.hero.slash .sword{animation:swordSwing .65s ease-in-out}@keyframes knightStrike{0%,100%{transform:translateX(0)}40%{transform:translateX(42px)}65%{transform:translateX(58px)}}@keyframes swordSwing{0%,100%{transform:rotate(0)}40%{transform:rotate(-55deg)}65%{transform:rotate(48deg)}}@media(max-width:480px){.sprite{width:78px;height:103px}.monster-sprite{width:86px}.fighters{min-height:130px}}</style></head><body><div class="shell"><div class="top"><div class="brand">✦ ZACH LEARNING CLUB</div><button class="sound" id="sound" aria-label="Toggle sound">🔊 Sound On</button></div><h1>📚 Book Explorer!</h1><p class="subtitle">Find the thinnest and thickest books ✨</p><main class="panel" id="quiz"><div class="row"><span id="count">Question 1 of 5</span><span id="stars">⭐ 0 / 5</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="battle"><div class="battle-label">⚔️ ZACH VS BOOK MONSTER ⚔️</div><div class="fighters"><span class="hero" id="hero"><svg class="sprite hero-sprite" viewBox="0 0 110 130" aria-label="Knight Zach" role="img"><ellipse cx="55" cy="121" rx="37" ry="6" fill="#344e75" opacity=".2"/><path d="M34 101L29 117H51L54 100M62 100L65 117H86L77 99" fill="#3e508b" stroke="#263767" stroke-width="4"/><path d="M35 65L27 101Q55 114 82 101L75 64Z" fill="#437bd9" stroke="#253b83" stroke-width="4"/><path d="M39 69L55 81L70 69L64 102H45Z" fill="#f2c65d"/><path d="M34 73L19 94L28 101L42 84" fill="#f5b77b" stroke="#7c4b53" stroke-width="3"/><path d="M76 73L91 84L86 95L72 83" fill="#f5b77b" stroke="#7c4b53" stroke-width="3"/><path d="M37 29Q55 4 74 29L75 53Q55 77 35 53Z" fill="#ffd2a1" stroke="#5a456b" stroke-width="4"/><path d="M32 39Q26 12 55 10Q82 11 78 39L70 30L39 30Z" fill="#6550aa" stroke="#45316f" stroke-width="4"/><circle cx="45" cy="43" r="3" fill="#26345d"/><circle cx="64" cy="43" r="3" fill="#26345d"/><path d="M48 53Q55 60 63 53" fill="none" stroke="#b46a65" stroke-width="3" stroke-linecap="round"/><g class="sword"><path d="M89 71L99 23L106 14L109 26L98 74Z" fill="#dceeff" stroke="#456c9d" stroke-width="3"/><path d="M82 69L105 76" stroke="#e5b44c" stroke-width="7" stroke-linecap="round"/><path d="M91 73L87 91" stroke="#66466d" stroke-width="6" stroke-linecap="round"/></g></svg></span><span class="versus">VS</span><span class="enemy-wrap"><span class="monster" id="monster"><svg class="sprite monster-sprite" viewBox="0 0 120 130" aria-label="Purple boss monster" role="img"><ellipse cx="60" cy="120" rx="40" ry="7" fill="#344e75" opacity=".2"/><path d="M28 37L17 11L45 25M75 25L102 11L93 43" fill="#f3c15e" stroke="#6e448d" stroke-width="5"/><path d="M18 69Q13 29 58 25Q108 23 106 73L100 105L83 115L70 106L59 116L46 106L32 115L19 100Z" fill="#9b6ce0" stroke="#6546a4" stroke-width="5"/><path d="M26 62Q38 50 49 64M70 64Q85 50 96 62" fill="none" stroke="#563b87" stroke-width="6" stroke-linecap="round"/><ellipse cx="42" cy="72" rx="10" ry="13" fill="#fff"/><ellipse cx="83" cy="72" rx="10" ry="13" fill="#fff"/><circle cx="45" cy="75" r="5" fill="#272a62"/><circle cx="80" cy="75" r="5" fill="#272a62"/><path d="M48 91Q61 106 77 91Z" fill="#442e75"/><path d="M54 94L58 100L63 94L68 100L72 94" fill="#fff"/><circle cx="26" cy="86" r="7" fill="#ee89c8"/><circle cx="98" cy="86" r="7" fill="#ee89c8"/></svg></span><span id="strike"></span></span></div><div class="hp"><div class="hpfill" id="hpfill"></div></div><div class="battle-label" id="hptext">Monster HP: 5 / 5</div></div><div class="stage"><div class="books" id="books"></div><div class="hint">👀 Look carefully at the thickness of each book.</div></div><h2>Which of the following statements is correct?</h2><div id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>Next Question →</button></main><footer>Made for Zachary 💜 · Grade 1 Maths</footer></div>
<script>
const questions=[{s:[2,5,1],o:[[0,1],[2,1],[1,0]],a:1},{s:[8,3,6],o:[[1,0],[2,1],[0,2]],a:0},{s:[4,7,2],o:[[1,0],[0,2],[2,1]],a:2},{s:[5,2,9],o:[[2,0],[1,2],[0,1]],a:1},{s:[3,1,6],o:[[2,1],[0,2],[1,2]],a:2}];let index=0,score=0,answered=false,soundOn=true,ctx;const get=id=>document.getElementById(id);function beep(correct){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();const notes=correct?[523,659,784]:[330,262];notes.forEach((freq,j)=>{let osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+j*.115;osc.type=correct?"sine":"triangle";osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.13,start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+.20);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.21)})}catch(e){}}get("sound").onclick=()=>{soundOn=!soundOn;get("sound").textContent=soundOn?"🔊 Sound On":"🔇 Sound Off";if(soundOn)beep(true)};function attack(){let hp=5-score;get("hpfill").style.width=(hp*20)+"%";get("hptext").textContent="Monster HP: "+hp+" / 5";let hero=get("hero");hero.classList.remove("slash");void hero.offsetWidth;hero.classList.add("slash");get("strike").innerHTML='<span class="strike">⚔️💥</span>';setTimeout(()=>{const v=get("strike");if(v)v.textContent=""},720);let m=get("monster");m.classList.remove("hit");void m.offsetWidth;m.classList.add("hit");if(hp===0)setTimeout(()=>{m.classList.remove("hit");m.classList.add("down");get("hptext").textContent="🏆 MONSTER DEFEATED!"},550)}
function victory(){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();let t=ctx.currentTime+.1;[523,659,784,1047,784,1047,1175,1319,1047].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),d=i===8?.65:.17;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02);t+=d})}catch(e){}}
function render(){answered=false;const q=questions[index];get("count").textContent="Question "+(index+1)+" of 5";get("stars").textContent="⭐ "+score+" / 5";get("fill").style.width=(index/5*100)+"%";get("books").innerHTML=q.s.map((s,j)=>'<div class="item"><div class="book" style="width:'+(32+s*12)+'px">'+String.fromCharCode(65+j)+'</div><div class="label">Book '+String.fromCharCode(65+j)+'</div></div>').join("");get("answers").innerHTML=q.o.map((pair,j)=>'<button class="answer" data-answer="'+j+'"><span class="badge">'+String.fromCharCode(65+j)+'</span><span>Book '+String.fromCharCode(65+pair[0])+' is the <b>thinnest</b> and Book '+String.fromCharCode(65+pair[1])+' is the <b>thickest</b>.</span></button>').join("");document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.answer))));get("feedback").textContent="";get("next").disabled=true;get("next").textContent=index===4?"See My Results 🏆":"Next Question →"}function choose(choice){if(answered)return;answered=true;const q=questions[index],correct=choice===q.a;if(correct){score++;attack()}beep(correct);document.querySelectorAll(".answer").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("correct");else if(j===choice)b.classList.add("wrong")});get("feedback").textContent=correct?"🌟 Amazing, Zach! That's correct!":"💡 Nice try! The green answer is correct.";get("feedback").style.color=correct?"#298c6b":"#d36c72";get("stars").textContent="⭐ "+score+" / 5";get("next").disabled=false;setTimeout(()=>{if(answered&&get("next")&&!get("next").disabled)get("next").click()},correct?1400:1700)}get("next").onclick=()=>{index++;if(index<5){render();window.scrollTo({top:0,behavior:"smooth"})}else{if(score===5){victory();setTimeout(()=>showResult(),1450)}else showResult()}};function showResult(){get("quiz").innerHTML='<div class="result"><div class="confetti">🎉🏆🎉</div><h1>Great job, Zach!</h1><p>You finished the challenge!</p><div class="score">'+score+' / 5 ⭐</div><p>'+(score===5?"Perfect score! You are a book expert!":"Every try makes you stronger!")+'</p><button class="next" onclick="location.reload()">🔄 Play Again</button></div>';if(score!==5)beep(true)}render();
</script></body></html>
