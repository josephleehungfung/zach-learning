<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zach Make 10 Quest</title><style>body{margin:0;background:linear-gradient(130deg,#e7edff,#fff1e2);font-family:system-ui,Arial;color:#283258;padding:20px}.app{max-width:700px;margin:auto;background:white;border-radius:26px;padding:24px;box-shadow:0 15px 35px #4546a42b}h1{text-align:center}.status{display:flex;justify-content:space-between;font-weight:bold}.battle{text-align:center;background:#e8f8ff;border-radius:20px;padding:12px;margin:18px 0}.actors{font-size:62px;display:flex;justify-content:space-around;align-items:center}.hero{display:inline-block}.hero.attack{animation:slash .6s}.monster{display:inline-block}.monster.hurt{animation:shake .6s}.monster.dead{transform:rotate(90deg);opacity:.4}.hp{background:#f8d0d5;border-radius:15px;height:16px;overflow:hidden}.fill{height:100%;width:100%;background:#ed6784;transition:width .5s}.shelf{background:#fff6df;border:5px solid #b98553;border-radius:12px;padding:12px}.shelfrow{min-height:82px;border-bottom:9px solid #b98553;padding:10px;display:flex;gap:12px;align-items:center}.shelfrow:last-child{border-bottom:0}.shelfrow b{width:85px;flex-shrink:0}.cars{font-size:23px;line-height:1.6}.prompt{font-size:19px;font-weight:700;margin:20px 0}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.choices button{border:2px solid #d9d6f9;background:#f5f2ff;border-radius:15px;padding:16px 4px;font-size:22px;font-weight:900;color:#5448ac}.choices button.correct{background:#c8f5d9}.choices button.wrong{background:#ffd8d8}.feedback{min-height:30px;font-weight:800;margin:15px 0}.shop{margin:12px 0;background:#f4f0ff;padding:12px;border-radius:15px}.shop button,.again{border:0;background:#6758dd;color:white;padding:12px;border-radius:12px;margin:4px;font-weight:800}.reward{font-size:22px;color:#5945bb;font-weight:900}.hidden{display:none}.result{text-align:center;padding:30px}@keyframes slash{40%{transform:translateX(65px) rotate(-30deg)}70%{transform:translateX(75px) rotate(25deg)}}@keyframes shake{30%{transform:translateX(14px)}65%{transform:translateX(-14px)}}@media(max-width:420px){.actors{font-size:47px}.cars{font-size:19px}.shelfrow b{width:65px;font-size:12px}.app{padding:16px}} </style><main class="app" id="app"><h1>🚗 Make 10 Quest!</h1><div class="status"><span id="progress">Question 1 / 5</span><span id="wallet">🪙 0 Coins</span></div><details class="shop"><summary>🛒 Hero Shop · Change armor</summary><div id="items"></div><small>Saved on this device only.</small></details><div class="battle"><b>⚔️ ZACH VS NUMBER MONSTER</b><div class="actors"><span class="hero" id="hero">🦸🏻‍♂️🗡️</span><span>VS</span><span class="monster" id="monster">👾</span></div><div class="hp"><div class="fill" id="hp"></div></div><b id="health">Monster HP 5 / 5</b></div><p class="prompt" id="prompt"></p><div class="shelf"><div class="shelfrow"><b>Upper shelf</b><span class="cars" id="upper"></span></div><div class="shelfrow"><b>Lower shelf</b><span class="cars" id="lower"></span></div></div><h2 id="equation"></h2><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></main><script>
const questions=[{upper:1,ask:"upper",name:"Henry"},{upper:3,ask:"lower",name:"Emma"},{upper:4,ask:"upper",name:"Jack"},{upper:2,ask:"lower",name:"Mia"},{upper:5,ask:"upper",name:"Zach"}];const $=id=>document.getElementById(id);let i=0,score=0,locked=false,ctx;const key="zach-rpg-save-v1";let save={coins:0,owned:["blue"],color:"blue"};try{const x=JSON.parse(localStorage.getItem(key));if(x&&Number.isFinite(x.coins))save={...save,...x}}catch(e){}const gear=[["blue","💙 Blue",0],["red","❤️ Red",10],["green","💚 Green",10],["gold","💛 Gold",20]];function persist(){try{localStorage.setItem(key,JSON.stringify(save))}catch(e){}}function shop(){ $("wallet").textContent="🪙 "+save.coins+" Coins";$("hero").style.filter=save.color==="red"?"hue-rotate(120deg)":save.color==="green"?"hue-rotate(240deg)":save.color==="gold"?"sepia(.8) saturate(2)":"none";$("items").innerHTML=gear.map(([id,name,cost])=>'<button data-id="'+id+'" '+(save.coins<cost&&!save.owned.includes(id)?"disabled":"")+'>'+name+" · "+(save.color===id?"Equipped":save.owned.includes(id)?"Equip":cost+" 🪙")+"</button>").join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{let g=gear.find(x=>x[0]===b.dataset.id);if(!save.owned.includes(g[0])){if(save.coins<g[2])return;save.coins-=g[2];save.owned.push(g[0])}save.color=g[0];persist();shop()})}function sound(win){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let notes=win?[523,659,784]:[330,262],t=ctx.currentTime;notes.forEach(f=>{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.19);t+=.14})}catch(e){}}function victory(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let t=ctx.currentTime;[523,659,784,1047,784,1047,1319].forEach((f,j)=>{let o=ctx.createOscillator(),g=ctx.createGain(),d=j===6?.65:.2;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}function render(){locked=false;let q=questions[i],lower=10-q.upper,answer=q.ask==="upper"?q.upper:lower;$("progress").textContent="Question "+(i+1)+" / 5 · ⭐ "+score;$("prompt").textContent=q.name+" has 10 toy cars. The upper shelf can hold 1 to 5 cars. How many cars are on the "+q.ask+" shelf?";$("upper").textContent=q.ask==="upper"?"❓":"🚙".repeat(q.upper);$("lower").textContent=q.ask==="lower"?"❓":"🚗".repeat(lower);$("equation").textContent=(q.ask==="upper"?"___":q.upper)+" + "+(q.ask==="lower"?"___":lower)+" = 10";$("choices").innerHTML=Array.from({length:10},(_,n)=>'<button data-n="'+(n+1)+'">'+(n+1)+'</button>').join("");document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.n),answer));$("feedback").textContent=""}function choose(n,answer){if(locked)return;locked=true;let good=n===answer;if(good){score++;$("hero").classList.add("attack");$("monster").classList.add("hurt");$("hp").style.width=(100-score*20)+"%";$("health").textContent=score===5?"🏆 MONSTER DEFEATED!":"Monster HP "+(5-score)+" / 5";if(score===5)$("monster").classList.add("dead")}sound(good);document.querySelectorAll("[data-n]").forEach(b=>{b.disabled=true;if(Number(b.dataset.n)===answer)b.classList.add("correct");else if(Number(b.dataset.n)===n)b.classList.add("wrong")});$("feedback").textContent=good?"🌟 Great! Sword attack!":"💡 "+answer+" is correct. Try the next one!";setTimeout(()=>{i++;$("hero").classList.remove("attack");$("monster").classList.remove("hurt");if(i<5)render();else finish()},good?1450:1750)}function finish(){let earned=score*2+(score===5?5:0);save.coins+=earned;persist();if(score===5)victory();$("app").innerHTML='<div class="result"><h1>🏆 Quest Complete!</h1><h2>⭐ '+score+' / 5</h2><p class="reward">🪙 +'+earned+' Coins</p><p>Total: '+save.coins+' Coins</p><button class="again" onclick="location.reload()">🔄 Play Again</button></div>'}shop();render();
</script></html>
