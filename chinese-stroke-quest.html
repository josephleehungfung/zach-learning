<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6657e8"><title>中文筆順勇者｜Zach 認字任務</title>
<style>
:root{--ink:#283357;--violet:#6657e8;--pink:#ff75a4;--mint:#46c6a6;--gold:#ffc75b}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,#ffe8b8 0,transparent 30%),radial-gradient(circle at 90% 20%,#c4f4e9 0,transparent 32%),linear-gradient(135deg,#eef0ff,#f9edff);padding:16px}
.shell{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:14px;font-weight:900;letter-spacing:1px;color:#6257ae}.chips{display:flex;gap:8px}.chip{background:white;border:1px solid #e0dcfa;border-radius:20px;padding:8px 12px;font-weight:900}
h1{text-align:center;font-size:clamp(28px,6vw,44px);margin:16px 0 4px}.subtitle{text-align:center;color:#777da0;margin:0 0 16px}.panel{background:white;border-radius:28px;padding:clamp(16px,4vw,30px);box-shadow:0 18px 45px #6559aa25}.track{height:13px;background:#ecebfa;border-radius:15px;overflow:hidden;margin:12px 0 18px}.fill{height:100%;width:0;background:linear-gradient(90deg,#62d6ae,#6657e8);transition:width .35s}
.battle{background:linear-gradient(#cdeaff 0 70%,#bce8b9 70%);border-radius:22px;padding:12px;text-align:center;margin:14px 0}.actors{display:flex;align-items:center;justify-content:space-evenly;min-height:105px;font-size:60px}.hero{display:inline-block}.hero.attack{animation:swing .55s}.monster{display:inline-block;transition:.45s}.monster.hit{animation:hit .45s}.monster.dead{transform:rotate(80deg) scale(.7);opacity:.3}.versus{font-size:18px;font-weight:1000;color:#a05a86}@keyframes swing{40%{transform:translateX(38px) rotate(-22deg)}70%{transform:translateX(48px) rotate(15deg)}}@keyframes hit{30%{transform:translateX(9px)}65%{transform:translateX(-9px)}}.hp{height:14px;background:#ffcad4;border-radius:20px;overflow:hidden;max-width:430px;margin:6px auto}.hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ffb54d,#ed6484);transition:width .45s}
.stagehead{text-align:center}.word{font-size:clamp(27px,6vw,38px);font-weight:1000;letter-spacing:8px;color:#5142b6}.meaning{color:#777da0;margin-top:4px}.target{display:flex;justify-content:center;align-items:center;gap:18px;margin:12px auto}.mainchar{width:min(35vw,150px);height:min(35vw,150px);background:#faf9ff;border:2px solid #eeeaff;border-radius:22px}.prompt{font-size:17px;font-weight:900}.small{font-size:13px;color:#777da0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px auto;max-width:460px}.choice{border:2px solid #e2e1f3;border-radius:18px;background:#fafbff;padding:8px;cursor:pointer;transition:.15s}.choice:active{transform:scale(.98)}.choice svg{display:block;width:min(34vw,145px);height:min(34vw,145px);margin:auto}.choice:hover{border-color:#a99bf0}.choice.correct{border-color:#39bf91;background:#e5fff2}.choice.wrong{border-color:#ff8b98;background:#fff0f1}.choice:disabled{cursor:default}.feedback{text-align:center;min-height:30px;font-weight:900;color:#298c6b}.next{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(100deg,#6657e8,#a06ce8);color:#fff;font-size:18px;font-weight:1000;cursor:pointer}.next:disabled{display:none}.wallet{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f6f2ff;border-radius:16px;padding:10px 14px;margin:10px 0 16px;font-weight:900}.shopToggle,.shopitem button{border:0;border-radius:12px;background:#6657e8;color:white;padding:10px 14px;font-weight:900;cursor:pointer}.shop{margin:0 0 18px;border:2px solid #dcd6ff;border-radius:18px;padding:14px;background:#fcfbff}.shop[hidden]{display:none}.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.shopitem{background:#f1f1ff;border-radius:14px;padding:10px;text-align:center;font-weight:800}.shopitem button{display:block;width:100%;margin-top:8px}.shopitem button:disabled{background:#b8b7cb}.result{text-align:center;padding:35px 10px}.score{font-size:48px;font-weight:1000;color:#6657e8}.hide{display:none!important}.footer{text-align:center;color:#9293b2;font-size:12px;padding:16px}.error{background:#fff0f1;color:#a33;padding:12px;border-radius:14px;text-align:center}
@media(max-width:480px){body{padding:10px}.chips{gap:4px}.chip{padding:7px 9px;font-size:13px}.actors{min-height:83px;font-size:48px}.target{gap:10px}.prompt{font-size:14px}.panel{padding:15px}.shopgrid{grid-template-columns:1fr}}
</style></head>
<body><main class="shell"><div class="top"><div class="brand">✦ ZACH LEARNING CLUB</div><div class="chips"><div class="chip">⭐ <span id="score">0</span></div><div class="chip">🪙 <span id="coins">0</span></div></div></div>
<h1>✍️ 中文筆順勇者</h1><p class="subtitle">看清楚每一筆，選出正確的下一筆！</p>
<section class="panel" id="app"><div class="wallet"><span id="round">準備開始 · 5 個詞語</span><button class="shopToggle" id="shopToggle">🛒 勇者裝備</button></div><div class="shop" id="shop" hidden><h3>裝備小店</h3><div class="shopgrid" id="shopgrid"></div><div class="small">分數和裝備只會保存在這部裝置的瀏覽器。</div></div>
<div class="track"><div class="fill" id="fill"></div></div><div class="battle"><b>⚔️ 勇者 Zach VS 筆順怪物 ⚔️</b><div class="actors"><span class="hero" id="hero">🦸🏻‍♂️🗡️</span><span class="versus">VS</span><span class="monster" id="monster">👾</span></div><div class="hp"><div class="hpfill" id="hp"></div></div><b id="hptext">每答對一筆，勇者攻擊一次</b></div>
<div id="play"><div class="stagehead"><div class="word" id="word"></div><div class="meaning" id="meaning"></div></div><div class="target"><svg class="mainchar" id="mainchar" viewBox="0 0 1024 1024" aria-label="目前字的筆順"></svg><div><div class="prompt" id="prompt">選出下一筆</div><div class="small" id="hint">先上後下，先左後右</div></div></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>繼續 →</button></div>
<div id="result" class="result hide"></div><div id="err" class="error hide"></div></section><div class="footer">做錯可以再試，答對就學會一筆 ✨</div></main>
<script>
const WORDS=[
["就是","強調、表示某事物正是所說的內容"],["然後","表示接着發生的事情"],["或者","表示其中一種選擇"],["因為","說明事情發生的原因"],["所以","表示事情的結果"],["但是","表示轉折"],["如果","表示假設一種情況"],["還是","表示選擇，或表示仍然如此"],["還有","表示另外也有"],["一起","共同做一件事"],["自己","本人"],["大家","所有人"],["已經","表示事情做過或發生了"],["可以","表示能夠或許可"],["不要","表示不想要或不應該"],["不能","表示不可以"],["不是","表示否定"],["只有","表示數量或範圍很少"],["開始","事情從這時候做起"],["最後","事情結束前或最末"],["現在","此時"],["以前","較早的時候"],["後來","之後發生的時候"],["突然","事情發生得很快、令人意外"]
];
const SAVEKEY="zach-stroke-quest-v1",RPGKEY="zach-rpg-save-v1";
let save={coins:0,owned:["blue"],color:"blue",weapon:false,hat:false},score=0,roundIndex=0,strokeIndex=0,characterIndex=0,current=null,answered=false,ctx;
try{let s=JSON.parse(localStorage.getItem(RPGKEY));if(s&&Number.isFinite(s.coins))save={...save,...s}}catch(e){}
let seen={};try{seen=JSON.parse(localStorage.getItem(SAVEKEY))||{}}catch(e){}
const $=id=>document.getElementById(id), colors={blue:"#437bd9",red:"#e46b6b",green:"#43b998",gold:"#efbd49"};
const gear=[["blue","💙 藍色盔甲",0,"color"],["red","❤️ 紅色盔甲",10,"color"],["green","💚 綠色盔甲",10,"color"],["gold","💛 黃金盔甲",20,"color"],["sword","🗡️ 閃亮寶劍",15,"weapon"],["crown","👑 勇者皇冠",25,"hat"]];
function persist(){try{localStorage.setItem(RPGKEY,JSON.stringify(save));localStorage.setItem(SAVEKEY,JSON.stringify(seen))}catch(e){}}
function shopRender(){$("coins").textContent=save.coins;$("shopgrid").innerHTML=gear.map(([id,name,cost,type])=>{let owned=type==="color"?save.owned.includes(id):type==="weapon"?save.weapon:save.hat,equipped=type==="color"?save.color===id:type==="weapon"?save.weapon:save.hat,label=equipped?"已裝備 ✓":owned?"使用":cost+" 🪙";return '<div class="shopitem">'+name+'<button data-gear="'+id+'" '+(equipped||(!owned&&save.coins<cost)?"disabled":"")+'>'+label+'</button></div>'}).join("");document.querySelectorAll("[data-gear]").forEach(b=>b.onclick=()=>{let g=gear.find(x=>x[0]===b.dataset.gear),owned=g[3]==="color"?save.owned.includes(g[0]):g[3]==="weapon"?save.weapon:save.hat;if(!owned){if(save.coins<g[2])return;save.coins-=g[2];if(g[3]==="color")save.owned.push(g[0]);else if(g[3]==="weapon")save.weapon=true;else save.hat=true}if(g[3]==="color")save.color=g[0];persist();shopRender()})}
$("shopToggle").onclick=()=>{$("shop").hidden=!$("shop").hidden;$("shopToggle").textContent=$("shop").hidden?"🛒 勇者裝備":"關閉小店"};shopRender();
function beep(ok){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let notes=ok?[660,880]:[290,220],t=ctx.currentTime;notes.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.08,t+i*.1);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.16);o.connect(g);g.connect(ctx.destination);o.start(t+i*.1);o.stop(t+i*.1+.17)})}catch(e){}}
function victory(){try{let notes=[523,659,784,1047,784,1047,1175,1319],t=ctx.currentTime;notes.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.18);t+=.16})}catch(e){}}
async function dataFor(ch){let u="https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/"+encodeURIComponent(ch)+".json",r=await fetch(u);if(!r.ok)throw Error("讀取筆順資料失敗（"+ch+"）");return await r.json()}
function svg(paths,highlight=-1,outline=true){let base=outline?paths.map(d=>'<path d="'+d+'" fill="#e5e4ef"/>').join(""):"";let done=paths.slice(0,Math.max(0,highlight)).map(d=>'<path d="'+d+'" fill="#536aaf"/>').join("");let active=highlight>=0&&highlight<paths.length?'<path d="'+paths[highlight]+'" fill="#ffb84d"/>':"";return '<svg viewBox="0 0 1024 1024" aria-hidden="true">'+base+done+active+'</svg>'}
function renderMain(){let paths=current.data.strokes;$("mainchar").innerHTML=paths.map((d,i)=>'<path d="'+d+'" fill="'+(i<strokeIndex?"#536aaf":"#e5e4ef")+'"/>').join("")}
function options(){let n=current.data.strokes.length,inds=[];for(let i=strokeIndex+1;i<n;i++)inds.push(i);for(let i=0;i<strokeIndex;i++)inds.push(i);inds.sort(()=>Math.random()-.5);let chosen=[strokeIndex,...inds.slice(0,3)].sort(()=>Math.random()-.5);$("choices").innerHTML=chosen.map(i=>'<button class="choice" data-i="'+i+'" aria-label="選擇筆畫"><svg viewBox="0 0 1024 1024">'+current.data.strokes.map((d,j)=>'<path d="'+d+'" fill="'+(j<strokeIndex?"#536aaf":"#e5e4ef")+'"/>').join("")+'<path d="'+current.data.strokes[i]+'" fill="#ffb84d"/></svg></button>').join("");document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(Number(b.dataset.i),b))}
function updateProgress(){let total=5;$("fill").style.width=(roundIndex/total*100)+"%";$("round").textContent="詞語 "+(roundIndex+1)+" / "+total+" · ⭐ "+score;$("hp").style.width=(100*(current.data.strokes.length-strokeIndex)/current.data.strokes.length)+"%";$("hptext").textContent="怪物體力 "+(current.data.strokes.length-strokeIndex)+" / "+current.data.strokes.length+" · 筆 "+(strokeIndex+1)+" / "+current.data.strokes.length}
async function startWord(){if(roundIndex>=5){finish();return}answered=false;let w=WORDS[(Number(localStorage.getItem("zach-word-rotation")||0)+roundIndex)%WORDS.length];$("word").textContent=w[0];$("meaning").textContent=w[1];let count=seen[w[0]]||0;let ch=w[0][count%w[0].length];seen[w[0]]=count+1;persist();$("feedback").textContent="";$("err").classList.add("hide");$("prompt").textContent="「"+ch+"」字，下一筆是哪一筆？";$("choices").innerHTML="";$("mainchar").innerHTML="";try{let data=await dataFor(ch);current={word:w[0],char:ch,data};strokeIndex=0;renderMain();options();updateProgress()}catch(e){$("err").textContent="筆順資料暫時未能載入，請檢查網絡後重試。";$("err").classList.remove("hide");$("choices").innerHTML='<button class="next" onclick="startWord()">重新載入</button>'}}
function pick(i,b){if(answered)return;if(i!==strokeIndex){beep(false);b.classList.add("wrong");$("feedback").textContent="再觀察一下：先上後下、先左後右，再試一次。";setTimeout(()=>b.classList.remove("wrong"),500);return}answered=true;score++;$("score").textContent=score;beep(true);let h=$("hero"),m=$("monster");h.classList.remove("attack");void h.offsetWidth;h.classList.add("attack");m.classList.remove("hit");void m.offsetWidth;m.classList.add("hit");b.classList.add("correct");$("feedback").textContent="✨ 答對了！勇者揮劍！";setTimeout(()=>{strokeIndex++;renderMain();if(strokeIndex>=current.data.strokes.length){m.classList.remove("hit");m.classList.add("dead");$("hptext").textContent="🏆 字寫完成，怪物被打倒！";$("choices").innerHTML="";$("feedback").textContent="「"+current.word+"」裏的「"+current.char+"」寫好了！";$("next").disabled=false;$("next").textContent=roundIndex===4?"查看成果 🏆":"下一個詞語 →"}else{answered=false;options();updateProgress()}},520)}
$("next").onclick=()=>{roundIndex++;$("next").disabled=true;startWord()};
function finish(){localStorage.setItem("zach-word-rotation",String((Number(localStorage.getItem("zach-word-rotation")||0)+5)%WORDS.length));let earned=score*2;save.coins+=earned;persist();shopRender();victory();$("play").classList.add("hide");$("result").classList.remove("hide");$("fill").style.width="100%";$("round").textContent="任務完成";$("result").innerHTML='<div style="font-size:54px">🎉🏆🎉</div><h2>筆順任務完成！</h2><div class="score">⭐ '+score+' 筆</div><p>你完成了 5 個詞語的筆順挑戰！</p><p>🪙 獲得 '+earned+' 金幣 · 現有 '+save.coins+' 金幣</p><button class="next" onclick="location.reload()">再玩一次 🔄</button>'}
$("score").textContent=score;startWord();
</script></body></html>
