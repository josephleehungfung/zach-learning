<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zach Math RPG · Three Numbers</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e4edff,#fff0dc);font-family:system-ui,Arial,sans-serif;color:#283357;padding:16px}.app{max-width:730px;margin:auto;background:white;border-radius:26px;padding:22px;box-shadow:0 16px 45px #5555aa30}h1{text-align:center;margin:5px 0 8px}.sub{text-align:center;color:#777da0;margin-bottom:18px}.status{display:flex;justify-content:space-between;font-weight:800;gap:8px}.battle{background:linear-gradient(#cdeaff 0 70%,#bce8b9 70%);border-radius:20px;padding:15px;text-align:center;margin:16px 0}.actors{display:flex;align-items:center;justify-content:space-evenly;font-size:64px;min-height:130px}.hero,.monster{display:inline-block}.hero.attack{animation:attack .65s}.monster.hurt{animation:hurt .55s}.monster.dead{transform:rotate(85deg) scale(.7);opacity:.45;transition:.5s}.hp{height:18px;background:#ffcad4;border-radius:20px;overflow:hidden}.fill{width:100%;height:100%;background:linear-gradient(90deg,#ffb54d,#ed6484);transition:width .5s}.question{text-align:center;background:#f4f1ff;border-radius:20px;padding:25px 8px;margin:20px 0}.equation{font-size:clamp(29px,8vw,52px);font-weight:1000;letter-spacing:1px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choices button{border:2px solid #dedafb;border-radius:16px;background:#f7f5ff;padding:18px 4px;font-size:24px;font-weight:900;color:#5042a2;cursor:pointer}.choices button.correct{background:#c8f6da;border-color:#41ba80}.choices button.wrong{background:#ffdadb;border-color:#ee8b9b}.feedback{min-height:33px;text-align:center;font-weight:900;margin:17px 0}.shop{background:#f3efff;border-radius:14px;padding:12px;margin:15px 0}.shop button,.again{border:0;border-radius:12px;padding:11px 13px;background:#6557d9;color:white;font-weight:800;margin:5px;cursor:pointer}.shop button:disabled{opacity:.45}.result{text-align:center;padding:35px 10px}.reward{font-size:26px;font-weight:900;color:#6557d9}@keyframes attack{40%{transform:translateX(70px) rotate(-20deg)}65%{transform:translateX(78px) rotate(20deg)}}@keyframes hurt{30%{transform:translateX(13px)}65%{transform:translateX(-13px)}}@media(max-width:440px){.actors{font-size:49px;min-height:110px}.app{padding:16px}.choices button{padding:15px 4px}}
</style><main class="app" id="app"><h1>⚔️ Math Hero Quest!</h1><div class="sub">Three numbers · Addition & Subtraction</div><div class="status"><span id="progress">Question 1 / 10</span><span id="wallet">🪙 0 Coins</span></div><details class="shop"><summary>🛒 Hero Shop · Armor Colors</summary><div id="items"></div><small>Coins are saved on this browser.</small></details><div class="battle"><b>⚔️ ZACH VS NUMBER BOSS ⚔️</b><div class="actors"><span class="hero" id="hero">🦸🏻‍♂️🗡️</span><span>VS</span><span class="monster" id="monster">👾</span></div><div class="hp"><div class="fill" id="hp"></div></div><b id="health">Boss HP 10 / 10</b></div><div class="question"><div class="equation" id="equation"></div><p>Choose the correct answer!</p></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div></main><script>
const questions=[[9,"+",6,"-",1],[8,"+",5,"-",3],[7,"+",6,"-",4],[9,"-",3,"+",5],[6,"+",8,"-",5],[8,"-",2,"+",7],[5,"+",9,"-",6],[9,"+",4,"-",7],[7,"-",4,"+",8],[6,"+",7,"-",2]];
const $=id=>document.getElementById(id);let index=0,score=0,locked=false,ctx;const key="zach-rpg-save-v1";let save={coins:0,owned:["blue"],color:"blue"};try{const x=JSON.parse(localStorage.getItem(key));if(x&&Number.isFinite(x.coins))save={...save,...x}}catch(e){}const gear=[["blue","💙 Blue",0],["red","❤️ Red",10],["green","💚 Green",10],["gold","💛 Gold",20]];function persist(){try{localStorage.setItem(key,JSON.stringify(save))}catch(e){}}function shop(){$("wallet").textContent="🪙 "+save.coins+" Coins";$("hero").style.filter=save.color==="red"?"hue-rotate(120deg)":save.color==="green"?"hue-rotate(240deg)":save.color==="gold"?"sepia(.8) saturate(2)":"none";$("items").innerHTML=gear.map(([id,name,cost])=>'<button data-id="'+id+'" '+(save.coins<cost&&!save.owned.includes(id)?"disabled":"")+'>'+name+" · "+(save.color===id?"Equipped":save.owned.includes(id)?"Equip":cost+" 🪙")+"</button>").join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{let g=gear.find(x=>x[0]===b.dataset.id);if(!save.owned.includes(g[0])){if(save.coins<g[2])return;save.coins-=g[2];save.owned.push(g[0])}save.color=g[0];persist();shop()})}
function play(notes){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let t=ctx.currentTime;notes.forEach((f,j)=>{let o=ctx.createOscillator(),g=ctx.createGain(),d=j===notes.length-1?.45:.15;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
function calc(q){let n=q[0];n=q[1]==="+"?n+q[2]:n-q[2];return q[3]==="+"?n+q[4]:n-q[4]}
function options(correct,i){let a=new Set([correct]);for(let d=1;a.size<4;d++){if(correct+d<=20)a.add(correct+d);if(a.size<4&&correct-d>=0)a.add(correct-d)}return [...a].sort((x,y)=>((x*13+i*7)%17)-((y*13+i*7)%17))}
function render(){locked=false;let q=questions[index],answer=calc(q);$("progress").textContent="Question "+(index+1)+" / 10 · ⭐ "+score;$("equation").textContent=q.join(" ")+" = ?";$("choices").innerHTML=options(answer,index).map(n=>'<button data-n="'+n+'">'+n+"</button>").join("");document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.n),answer));$("feedback").textContent=""}
function choose(n,answer){if(locked)return;locked=true;let good=n===answer;if(good){score++;$("hero").classList.add("attack");$("monster").classList.add("hurt");$("hp").style.width=(100-score*10)+"%";$("health").textContent=score===10?"🏆 BOSS DEFEATED!":"Boss HP "+(10-score)+" / 10";if(score===10)$("monster").classList.add("dead")}play(good?[523,659,784]:[330,262]);document.querySelectorAll("[data-n]").forEach(b=>{b.disabled=true;if(Number(b.dataset.n)===answer)b.classList.add("correct");else if(Number(b.dataset.n)===n)b.classList.add("wrong")});$("feedback").textContent=good?"🌟 Correct! Sword attack!":"💡 Correct answer: "+answer;setTimeout(()=>{index++;$("hero").classList.remove("attack");$("monster").classList.remove("hurt");if(index<10)render();else finish()},good?1400:1700)}
function finish(){let prize=score*2+(score===10?10:0);save.coins+=prize;persist();if(score===10)play([523,659,784,1047,784,1047,1319]);$("app").innerHTML='<div class="result"><h1>🏆 Quest Complete!</h1><h2>⭐ '+score+' / 10</h2><p class="reward">🪙 +'+prize+' Coins</p><p>Total: '+save.coins+' Coins</p><button class="again" onclick="location.reload()">🔄 Play Again</button></div>'}shop();render();
</script></html>
