<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odd Number Quest</title><style>*{box-sizing:border-box}body{margin:0;background:#e6efff;color:#183153;font-family:Arial,sans-serif;padding:20px}main{max-width:680px;margin:30px auto;background:#fffdf5;padding:30px;border:4px solid #183153;border-radius:24px}h1{font-size:28px}.track{background:#dbe5ef;border-radius:20px;overflow:hidden;height:18px}#bar{height:100%;background:#60caa7;width:0;transition:.3s}.q{font-size:28px;line-height:1.6;margin:35px 0}input{font-size:30px;width:90px;text-align:center;border:3px solid #4c8bf5;border-radius:10px;padding:10px}button{font-size:21px;padding:14px 24px;background:#ffd166;border:3px solid #183153;border-radius:12px;cursor:pointer}#feedback{font-size:20px;min-height:85px;line-height:1.5}.tip{font-size:16px;color:#61718a}b{color:#2e64bf}</style><main><h1>⭐ Odd Number Quest</h1><p id="count">10 questions • Count the odd numbers</p><div class="track"><div id="bar"></div></div><section id="game"><p class="q" id="question"></p><form id="form"><input aria-label="Number of odd numbers" id="answer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required><button id="check">Check ✓</button></form><p id="feedback" aria-live="polite"></p></section><section id="end" hidden><h2>🏆 Quest Complete!</h2><p id="result"></p><button onclick="location.reload()">Try again</button></section></main><script>
const qs=[[11,19,[13,15,17]],[3,11,[5,7,9]],[5,15,[7,9,11,13]],[7,17,[9,11,13,15]],[9,15,[11,13]],[1,9,[3,5,7]],[10,18,[11,13,15,17]],[4,12,[5,7,9,11]],[12,20,[13,15,17,19]],[6,10,[7,9]]];let i=0,score=0,locked=false,audio;
function sound(ok){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?700:230;g.gain.value=.06;o.start();o.stop(audio.currentTime+.15)}catch(e){}}
function show(){locked=false;let x=qs[i];document.getElementById('question').innerHTML='There are ____ <b>odd numbers</b> <b>between '+x[0]+' and '+x[1]+'</b>.';document.getElementById('count').textContent='Question '+(i+1)+' / 10 · ⭐ '+score;document.getElementById('answer').value='';document.getElementById('answer').disabled=false;document.getElementById('check').disabled=false;document.getElementById('feedback').textContent='';document.getElementById('bar').style.width=(i*10)+'%'}
document.getElementById('form').onsubmit=e=>{e.preventDefault();if(locked)return;let v=document.getElementById('answer').value.trim();if(!/^\d+$/.test(v))return;locked=true;let x=qs[i],ok=Number(v)===x[2].length;if(ok)score++;sound(ok);document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true;document.getElementById('feedback').textContent=(ok?'🌟 Correct! ':'💡 The answer is '+x[2].length+'. ')+x[2].join(', ')+'. Do not count the two end numbers.';setTimeout(()=>{i++;if(i<10)show();else{document.getElementById('game').hidden=true;document.getElementById('end').hidden=false;document.getElementById('count').textContent='Complete';document.getElementById('bar').style.width='100%';document.getElementById('result').textContent='You got '+score+' / 10 correct!'}},2600)};show();
</script></html>
