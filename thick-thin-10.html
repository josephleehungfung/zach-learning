<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thick & Thin Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f1ff;color:#183153;font-family:Arial,sans-serif;padding:16px}main{max-width:760px;margin:20px auto;background:#fffdf6;border:3px solid #183153;border-radius:25px;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(21px,5vw,30px)}.track{height:16px;border-radius:20px;background:#dde6ef;overflow:hidden}#bar{height:100%;background:#60caa7;width:0;transition:.3s}#question{text-align:center;font-size:clamp(26px,6vw,36px);margin:30px 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{cursor:pointer;color:inherit;font:inherit;border:3px solid #b7cbe1;background:white;border-radius:18px;padding:12px}.choice{min-width:0}.choice svg{width:100%;height:auto;display:block}.choice:hover{border-color:#4c8bf5}.choice:disabled{cursor:default}.correct{background:#d2f5dc;border-color:#39a967!important}.wrong{background:#ffe1dd;border-color:#de7161!important}#feedback{text-align:center;min-height:72px;font-size:19px;line-height:1.5;margin:16px 0}.action{background:#ffd166;border-color:#183153;padding:12px 22px}.center{text-align:center}.hint{font-size:15px;color:#65758b}
</style></head><body><main><header><h1>📚 Thick & Thin Quest</h1><b>⭐ <span id="score">0</span></b></header><p id="count">10 picture questions</p><div class="track"><div id="bar"></div></div><section id="game"><h2 id="question"></h2><p class="center hint">Tap the correct picture.</p><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p></section><section id="end" class="center" hidden><h2>🏆 Quest Complete!</h2><p id="result"></p><button class="action" onclick="location.reload()">Play again</button></section></main><script>
const qs=[
['burger','thicker',true],['book','thinner',true],['sponge','thicker',false],['sandwich','thinner',false],['cake','thicker',true],['book','thicker',false],['burger','thinner',false],['cake','thinner',true],['sandwich','thicker',true],['sponge','thinner',false]
];
function picture(type,thick){let h=thick?82:30,y=166-h,s='';if(type==='book'){s='<rect x="35" y="'+y+'" width="170" height="'+h+'" rx="7" fill="#f8f3df" stroke="#183153" stroke-width="3"/>';for(let k=y+8;k<163;k+=8)s+='<path d="M48 '+k+'H198" stroke="#c4c4bc" stroke-width="2"/>';s+='<rect x="30" y="'+(y-7)+'" width="180" height="10" rx="4" fill="#5f87dd" stroke="#183153" stroke-width="3"/><rect x="30" y="163" width="180" height="10" rx="4" fill="#5f87dd" stroke="#183153" stroke-width="3"/>'}
else if(type==='sponge'){s='<rect x="35" y="'+y+'" width="170" height="'+h+'" rx="9" fill="#ffdb66" stroke="#183153" stroke-width="3"/>';for(let x=50;x<200;x+=25)s+='<circle cx="'+x+'" cy="'+(y+h/2)+'" r="4" fill="#dbad39"/>';s+='<rect x="35" y="158" width="170" height="12" rx="4" fill="#54aa83" stroke="#183153" stroke-width="3"/>'}
else if(type==='cake'){s='<rect x="35" y="'+y+'" width="170" height="'+h+'" rx="5" fill="#b8784c" stroke="#183153" stroke-width="3"/><rect x="36" y="'+(y+h*.48)+'" width="168" height="9" fill="#ffe3bc"/><rect x="32" y="'+(y-8)+'" width="176" height="15" rx="6" fill="#f4b2c3" stroke="#183153" stroke-width="3"/>'}
else {let layers=thick?3:1;let bottom=170; s='<rect x="35" y="158" width="170" height="15" rx="7" fill="#e8b66c" stroke="#183153" stroke-width="3"/>';for(let k=0;k<layers;k++){let yy=139-k*23;s+='<rect x="38" y="'+yy+'" width="164" height="15" rx="6" fill="#80503a" stroke="#183153" stroke-width="2"/><path d="M35 '+(yy-3)+'Q55 '+(yy-14)+' 75 '+(yy-3)+'T115 '+(yy-3)+'T155 '+(yy-3)+'T205 '+(yy-3)+'" fill="none" stroke="#71b65a" stroke-width="8"/>'}let top=125-(layers-1)*23;s+=type==='burger'?'<path d="M35 '+top+'Q40 '+(top-42)+' 120 '+(top-42)+'Q200 '+(top-42)+' 205 '+top+'Z" fill="#efc17b" stroke="#183153" stroke-width="3"/>':'<rect x="33" y="'+(top-16)+'" width="174" height="20" rx="6" fill="#f7dba9" stroke="#183153" stroke-width="3"/>'}
return '<svg viewBox="0 0 240 210" role="img" aria-label="'+type+'"><ellipse cx="120" cy="183" rx="95" ry="7" fill="#e7edf4"/>'+s+'</svg>'}
let i=0,score=0,locked=false,ctx;
function tone(ok){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?700:240;g.gain.value=.07;o.start();o.stop(ctx.currentTime+.18)}catch(e){}}
function show(){locked=false;let [type,word,left]=qs[i];document.getElementById('question').textContent='The '+word+' one.';document.getElementById('count').textContent='Question '+(i+1)+' / 10';document.getElementById('bar').style.width=(i*10)+'%';document.getElementById('feedback').textContent='';let box=document.getElementById('choices');box.innerHTML='';[left,!left].forEach((thick,n)=>{let b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',(n===0?'Left':'Right')+' '+type);b.innerHTML=picture(type,thick);b.onclick=()=>pick(b,thick=== (word==='thicker'));box.appendChild(b)})}
function pick(b,ok){if(locked)return;locked=true;tone(ok);if(ok)score++;b.classList.add(ok?'correct':'wrong');let x=qs[i],correct=x[2]===(x[1]==='thicker')?0:1;document.getElementById('choices').children[correct].classList.add('correct');[...document.querySelectorAll('.choice')].forEach(b=>b.disabled=true);document.getElementById('score').textContent=score;document.getElementById('feedback').textContent=ok?'🌟 Well done!':'💡 Look at the green picture. '+(x[1]==='thicker'?'Thicker = 較厚':'Thinner = 較薄');setTimeout(()=>{i++;if(i<10)show();else{document.getElementById('game').hidden=true;document.getElementById('end').hidden=false;document.getElementById('bar').style.width='100%';document.getElementById('result').textContent='You got '+score+' / 10 correct!';document.getElementById('count').textContent='Complete'}},1800)}
show();
</script></body></html>
